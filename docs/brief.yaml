    what: LAS parsing, unit standardisation and quality checks for 28,906 files
    proof: [["src/kansas.py", "src/kansas.py"], ["ADR-006", "docs/adr/ADR-006-log-quality-and-drift.md"]]
  - group: Machine learning
    what: XGBoost, LightGBM and a PyTorch 1D CNN under one comparison
    proof: [["ADR-004", "docs/adr/ADR-004-baseline-and-model-choice.md"], ["ADR-009", "docs/adr/ADR-009-method-comparison.md"]]
  - group: Statistics and evaluation
