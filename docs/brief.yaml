# Hiring-team brief (rule R22). Edit here only; `python scripts/brief.py` writes it into README.md, docs/index.html and docs/build.html.
repo_url: https://github.com/sabrinapribadi/well-log-lithology
brief:
  - w: What
    lines:
      - A rock-type (lithology) model for well logs, served as a results page, an API, MCP tools and grounded notes.
  - w: Why
    lines:
      - Petrophysicists pick lithology by hand at every 0.152 m of every well; a checked first pass shows where to look first.
  - w: Who
    lines:
      - "Users: petrophysicists and geologists reviewing new wells."
      - "Data: FORCE 2020 North Sea, 118 wells with interpreted rock types (CC BY 4.0), plus 28,906 public Kansas LAS files."
  - w: Where
    lines:
      - "[Results page](https://sabrinapribadi.github.io/well-log-lithology/) and [technical walkthrough](https://sabrinapribadi.github.io/well-log-lithology/build.html) on GitHub Pages; [live API and MCP](https://well-log-lithology.vercel.app/docs) on Vercel; yearly job, registry and app on Databricks."
  - w: When it fails
    lines:
      - 8 phases, each with a pass bar set before the work; 3 failed and are reported (baseline, Kansas transfer, cloud parity).
      - "No live A/B test: there are no live users. Changes face 10 blind wells, grouped cross-validation and a 10-seed paired test."
  - w: How
    lines:
      - XGBoost with engineered features and a penalty-aware decision, chosen over LightGBM and a 1D CNN by cross-validation.
      - "Score: the official FORCE penalty, 0 is perfect: −0.504 on 10 unseen wells (4th of 13 2020 finalists); beats the baseline on 10 of 10 seeds."
skills:
