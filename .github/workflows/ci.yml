name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: ruff check src scripts tests
      - name: Hiring-team brief in sync with docs/brief.yaml (R22)
        run: python scripts/brief.py --check
      - run: python -m pytest -q tests


  # R10/R19: the pages' browser tests in real Chrome (desktop light, dark, phone 400 px); a failure blocks publishing.
  browser:
    runs-on: ubuntu-latest
    env:
      NODE_PATH: /tmp/pt/node_modules
      CHROME_ARGS: --no-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-save --prefix /tmp/pt puppeteer-core@23.11.1
      - run: echo "CHROME_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
      - run: node tests/browser/hover_test.js "$PWD/docs/index.html" /tmp
      - run: node tests/browser/build_test.js "$PWD/docs/build.html" /tmp

  # R19: GitHub Pages deploy from main by workflow, only after unit and browser tests pass.
  pages:
    needs: [test, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: deploy
        uses: actions/deploy-pages@v4

  # CD (R19, ADR-011): build the read-only bundle, sign its provenance, deploy to Vercel Hobby, smoke-test the live URL.
  # Skips the deploy (job stays green) until the VERCEL_TOKEN secret exists.
  deploy:
    needs: [test, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # signs the build provenance
      attestations: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build the bundle (serving code, config, checksummed snapshot)
        run: |
          python scripts/build_deploy.py --out build/well-log-lithology
          tar -czf build/well-log-lithology.tar.gz -C build well-log-lithology
      - name: Sign build provenance
        uses: actions/attest-build-provenance@v4
        with: {subject-path: build/well-log-lithology.tar.gz}
      - uses: actions/upload-artifact@v4
        with: {name: deploy-bundle, path: build/well-log-lithology.tar.gz}
      - name: Deploy to Vercel (production)
        if: env.VERCEL_TOKEN != ''
        id: vercel
        working-directory: build/well-log-lithology
        run: echo "url=$(npx -y vercel@65.4.0 deploy --prod --yes --token "$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
      - name: Smoke test the live URL
        if: env.VERCEL_TOKEN != ''
        run: python scripts/smoke_test.py "${{ vars.PUBLIC_URL || steps.vercel.outputs.url }}"
      - name: No token yet
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::VERCEL_TOKEN not set; bundle built and attested, deploy skipped."

  # CD to Databricks (R19, ADR-011 §3): deploy the bundle (yearly job + Databricks App) and restart the app on the new code.
  # Credentials only in GitHub Secrets; skips (job stays green) until DATABRICKS_HOST and DATABRICKS_TOKEN exist.
  databricks:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      APP_HOST: ${{ vars.DATABRICKS_APP_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: No credentials yet
        if: env.DATABRICKS_TOKEN == ''
        run: echo "::notice::DATABRICKS_HOST / DATABRICKS_TOKEN not set; Databricks deploy skipped."
      - uses: databricks/setup-cli@v1.20.0
        if: env.DATABRICKS_TOKEN != ''
      - name: Build the app (MCP allow-list = the app's own hostname)
        if: env.DATABRICKS_TOKEN != ''
        run: python scripts/build_deploy.py --out build/databricks-app --databricks-host "$APP_HOST"
      - name: Deploy the bundle and start the app
        if: env.DATABRICKS_TOKEN != ''
        run: |
          databricks bundle validate
          databricks bundle deploy
          databricks bundle run og2_api
